<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80" width="520" height="80">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- Icon -->
  <rect x="0" y="4" width="72" height="72" rx="14" ry="14" fill="url(#brandGrad)"/>
  <text x="36" y="44" text-anchor="middle" dominant-baseline="central"
    font-family="'Outfit', sans-serif" font-weight="800" font-size="30" fill="white" letter-spacing="-1">LP</text>
  <!-- Circuit nodes on icon -->
  <circle cx="12" cy="12" r="2" fill="rgba(255,255,255,0.3)"/>
  <circle cx="60" cy="12" r="2" fill="rgba(255,255,255,0.3)"/>
  <circle cx="12" cy="64" r="2" fill="rgba(255,255,255,0.3)"/>
  <circle cx="60" cy="64" r="2" fill="rgba(255,255,255,0.3)"/>
  <!-- Growth arrow -->
  <line x1="48" y1="58" x2="58" y2="52" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" stroke-linecap="round"/>
  <polyline points="55,50 58,52 56,55" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Text -->
  <text x="88" y="36" font-family="'Outfit', sans-serif" font-weight="800" font-size="28" fill="url(#brandGrad)" letter-spacing="-0.5">Lp</text>
  <text x="122" y="36" font-family="'Outfit', sans-serif" font-weight="400" font-size="28" fill="#1E293B" letter-spacing="-0.5"> Fincorp</text>
  <text x="88" y="62" font-family="'Instrument Sans', sans-serif" font-weight="400" font-size="14" fill="#64748B" letter-spacing="3">WEB SOLUTION</text>
</svg>