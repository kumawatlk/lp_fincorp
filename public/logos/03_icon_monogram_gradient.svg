<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="10" y="10" width="180" height="180" rx="32" ry="32" fill="url(#brandGrad)"/>
  <!-- LP letterform -->
  <text x="100" y="124.0" text-anchor="middle" dominant-baseline="central"
    font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="800" font-size="84.0"
    fill="white" letter-spacing="-2">LP</text>
  <!-- Subtle circuit nodes -->
  <circle cx="36.0" cy="36.0" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="164.0" cy="36.0" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="36.0" cy="164.0" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="164.0" cy="164.0" r="3" fill="rgba(255,255,255,0.3)"/>
  <!-- Growth arrow hint -->
  <line x1="130.0" y1="156.0" x2="160.0" y2="140.0" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="152.0,136.0 160.0,140.0 156.0,148.0" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Subtle connecting lines -->
  <line x1="36.0" y1="44.0" x2="36.0" y2="156.0" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
  <line x1="44.0" y1="164.0" x2="156.0" y2="164.0" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
</svg>